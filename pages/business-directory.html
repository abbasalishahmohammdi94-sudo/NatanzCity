<!doctype html>
<html dir="rtl" lang="fa-IR">
  <head>
    <title>جستجو برای کسب و کار | NatanzCity</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/OrgStyle/business-card.css" />

    <!-- JavaScript -->
    <script src="../assets/js/OrgJS/bd-image-fallback.js" defer></script>
    <script src="../assets/js/OrgJS/search-business.js" defer></script>
  </head>

  <body>
    <main>
      <div class="container py-5">
        <h2 class="text-center mb-4">🔎 جستجوی کسب‌وکارهای نطنز</h2>

        <input
          id="business-search"
          class="form-control"
          placeholder="مثلاً: لبنیات، موبایل، رستوران..."
        />

        <div id="search-loading" class="text-center mt-4" style="display: none">
          🔎 در حال جستجوی کسب‌وکارهای نطنز...
        </div>

        <hr />

        <div
          class="row g-4 justify-content-center mt-4"
          id="business-list"
          style="display: none"
        ></div>
      </div>
    </main>
  </body>
</html>
